# 러너 로컬 키스토어 예시 — 실제 파일은 ~/.controltower/keystore.toml (권한 600 권장)
# 중앙 DB 의 servers.credential_alias / gateway 의 alias 와 이름을 맞춘다.
# 이 파일(키 경로/비밀)은 러너 머신에만 존재하고 중앙으로 절대 보내지 않는다.

[gw-prod]
username = "deploy"
key_path = "~/.ssh/gw_prod_ed25519"
# passphrase = "..."   # 필요 시. 가능하면 ssh-agent 사용 권장.

[gw-dev]
username = "deploy"
key_path = "~/.ssh/gw_dev_ed25519"

# 직접 접속(direct) 대상용 키도 여기에. (대상 키가 gw 에 있으면 gw alias 만 있으면 됨)
[build-server]
username = "ci"
key_path = "~/.ssh/build_ed25519"
