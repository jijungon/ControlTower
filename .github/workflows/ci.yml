name: CI

# FileSharer ci-test 방식:
#  - 각 PR = 가벼운 검사(backend·frontend·gitleaks) 만
#  - 무거운 검사(deps-audit·image·e2e)는 merge queue(합쳐서 한 번) + main push 에서만
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# 같은 PR 의 이전 실행은 취소(자원 절약). main·merge_group 은 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── PR 마다: 빠른 검사 ─────────────────────────────
  backend:
    runs-on: ubuntu-24.04   # 'latest' 금지 — GitHub 가 다음 LTS 로 바꾸면 조용히 깨진다
    env:
      # 시크릿은 repo Settings → Secrets 에 등록. 미설정 시 CI 더미(테스트는 SQLite).
      CT_SECRET: ${{ secrets.CT_SECRET || 'ci-dummy-secret' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci-dummy-pw' }}
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            central/api/requirements.txt
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt -r central/api/requirements.txt
      - name: Alembic 마이그레이션 점검 (빈 DB → head)
        working-directory: central/api
        env:
          DATABASE_URL: sqlite:///./ci_migrate.db
          PYTHONPATH: .
        run: alembic upgrade head
      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: central/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: central/web/package-lock.json
      - run: npm ci
      - name: Vitest (컴포넌트)
        run: npm run test

  gitleaks:
    # 공개 repo 라 시크릿 유출은 PR 단계에서 즉시 잡는다(빠름).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # PR 스캔에 필수(자동 제공 토큰)
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # ── merge queue + main push 에서만: 무거운 검사 ─────
  deps-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # 두 검사 모두 실패는 안 시킨다(비차단). 대신 건수·목록을 실행 요약(Summary)에 적고,
      # 1건 이상이거나 검사 자체가 못 돌면 ::warning:: 으로 띄운다 — `|| true` 로 묻히지 않게.
      - name: pip-audit (API 의존성)
        run: |
          python -m pip install -U pip pip-audit
          pip-audit -r central/api/requirements.txt -f json -o pip-audit.json || true
          if ! n=$(jq -e '[.dependencies[] | (.vulns // []) | length] | add // 0' pip-audit.json 2>/dev/null); then
            echo "### pip-audit (API 의존성): 검사 실패 — 로그 확인" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning title=pip-audit::검사가 끝까지 못 돌았음 — 로그 확인"
            exit 0
          fi
          {
            echo "### pip-audit (API 의존성): ${n}건"
            if [ "$n" -gt 0 ]; then
              echo "| 패키지 | 버전 | ID | 수정판 |"
              echo "|---|---|---|---|"
              jq -r '.dependencies[] | .name as $p | .version as $v | (.vulns // [])[]
                     | "| \($p) | \($v) | \(.id) | \(.fix_versions | join(", ")) |"' pip-audit.json
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo "::warning title=pip-audit::API 의존성 취약점 ${n}건 — 실행 요약(Summary) 확인"
          fi
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - name: npm audit (web)
        working-directory: central/web
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          if ! n=$(jq -e '.metadata.vulnerabilities.total' npm-audit.json 2>/dev/null); then
            echo "### npm audit (web): 검사 실패 — 로그 확인" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning title=npm audit::검사가 끝까지 못 돌았음 — 로그 확인"
            exit 0
          fi
          {
            echo "### npm audit (web): ${n}건"
            if [ "$n" -gt 0 ]; then
              echo "| 패키지 | 심각도 | 영향 범위 | 고치는 법 |"
              echo "|---|---|---|---|"
              jq -r '.vulnerabilities | to_entries[]
                     | "| \(.key) | \(.value.severity) | \(.value.range | gsub("\\|"; "\\|")) | \(.value.fixAvailable
                        | if type == "object" then "\(.name)@\(.version)" + (if .isSemVerMajor then " (메이저 변경)" else "" end)
                          elif . then "npm audit fix" else "아직 없음" end) |"' npm-audit.json
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo "::warning title=npm audit::web 의존성 취약점 ${n}건 — 실행 요약(Summary) 확인"
          fi

  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build API image (push 안 함 — 빌드 검증만)
        run: docker build -t controltower-api:ci central/api
      - name: Build web image (push 안 함)
        run: docker build -t controltower-web:ci central/web
      - name: Build collector image (push 안 함) — 화면 [다시 수집] 을 처리하는 수집기
        run: docker build -t controltower-collector:ci runner

  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central/api/requirements.txt
      - name: Install API deps
        run: |
          python -m pip install -U pip
          pip install -r central/api/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: central/web/package-lock.json
      - name: Install web deps
        working-directory: central/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: central/web
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E (api+web 풀스택)
        working-directory: central/web
        run: npx playwright test
