# 서비스 비교표 대상 — 복사해서 shape-targets.yml 로 쓰세요(커밋 안 됨: 사내 경로가 들어감).
#   cp runner/shape-targets.example.yml shape-targets.yml
#   python -m runner.cli shape
#
# 소스 한 칸은 셋 중 하나:
#   {gitlab: repo|center, project: group/repo, path: 파일경로, ref: main}   ← GitLab API(읽기 토큰)
#   {file: 경로}                                                              ← 로컬 파일(이 파일 기준 상대경로 가능)
#   {ssh: 호스트별칭, path: /app/web-shop/docker-compose.yml}                 ← 서버의 실제 파일(~/.ssh/config 별칭)
# 읽은 파일 내용은 판독에만 쓰고 중앙엔 올리지 않는다(결과 칸만 올라감).
# 빈 칸은 그냥 빼면 됩니다(표에 '—').

# GitLab 은 러너의 executor 를 알려주지 않음 → 사람이 한 번 확인해 적어 두는 표.
# 여기 없는 태그는 화면에 'shell (추정)' 처럼 짐작값으로 표시됩니다.
runners:
  shell-runner: shell
  builder: docker           # (예) center 빌더 — 배포 job 이 image: 를 쓰면 docker 일 가능성이 큼
  builder-docker: docker

# (선택) 배포 서버가 ~/.ssh/config 에 직접 없을 때 거칠 게이트웨이(환경 → ~/.ssh/config 별칭).
# shape --ssh 가 PC → gw → 서버 로 들어가 compose 를 읽음(안쪽 접속은 gw 의 키·설정 사용, 읽기만).
gateways:
  dev: shop-gw-dev
  prod: shop-gw-prod
# gateway_user: app          # (선택) gw 에서 안쪽 서버로 들어갈 사용자

# center config repo — <서비스>/<web|was>/ 폴더를 자동으로 훑어 config 탭을 채움
config:
  gitlab: center
  project: shop/config
  # file: ../config-clone        # 로컬 사본이면 이렇게
  compose:                       # (선택) 서버 compose → 'start.sh 형태' 칸(shell/compose/Dockerfile). 폴더: {환경: 소스}
    shop/was: {prod: {ssh: shop-prod-01, path: /app/was-shop/docker-compose.yml}}

services:
  - name: shop web          # 표에 보이는 이름
    group: shop             # 서비스보다 큰 묶음(프로젝트 그룹) — 표에서 그룹별로 나뉨
    note: 옛 사본            # (선택) 표에 작게 붙는 서비스 메모(예: repo: other-repo)
    source_note: 옛 사본     # (선택) 이 서비스 파일들의 출처 메모 — config 탭 (서버) 칸 아래에 표시
    type: web               # web | was — 태그 정규식(<env>-<type>-v1.2.3) 판정용
    repo_ci:    {gitlab: repo,   project: shop/shop-web, path: .gitlab-ci.yml}
    center_ci:  {gitlab: center, project: shop/shop,     path: .gitlab-ci.yml}
    config_dir: shop/web    # config 폴더에서 Dockerfile·start.sh 를 알아서 읽음 (아래 두 줄 대신)
    # dockerfile: {gitlab: center, project: shop/config, path: shop/web/Dockerfile}
    # startup:    {gitlab: center, project: shop/config, path: shop/web/node-startup.sh}
    compose:                # 선택 — 서버 compose. 파일마다 note: 를 달면 화면 출처 칸에 그대로(예: note: 옛 사본)
      prod: {gitlab: center, project: shop/deploy, path: prod/docker-compose-shop-web.yml}

  - name: shop was
    group: shop
    type: was
    repo_ci:    {file: ../ci-copies/shop/repo/shop-was.gitlab-ci.yml}
    dockerfile: {file: ../ci-copies/shop/config/shop-was.Dockerfile}
