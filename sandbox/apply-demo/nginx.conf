# 연습용 기준본(정답) — 이 내용이 '중앙 기준본'이 된다.
# 검증 때: 컨테이너의 이 파일을 일부러 다르게 바꿔 '드리프트'를 만들고,
# apply 로 이 내용으로 되돌리는지 확인한다.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    gzip on;

    server {
        listen 80;
        server_name _;

        location / {
            return 200 "ok\n";
        }
    }
}
