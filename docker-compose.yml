# Control Tower — 중앙 서비스 (사내 VM에서 실행)
# 수집기(collector)는 화면 [다시 수집] 요청만 처리하고 GitLab 만 읽는다(SSH 키 없음).
# 서버 SSH 가 필요한 수집(compose · OS 패치 · /etc)은 키가 있는 곳의 러너 CLI 로. runner/ 참고.
# 실행: cp .env.example .env  →  값 채우고  →  docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-controltower}
      POSTGRES_USER: ${DB_USER:-ctower}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # 호스트 로컬 디렉토리(bind mount) — 데이터가 <repo>/data/pgdata 에 보인다. .env 로 경로 조정.
      - ${PG_DATA_DIR:-./data/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ctower} -d ${DB_NAME:-controltower}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./central/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 로그인 사용자 — 기본 none(모름). proxy 는 앞단 Authentik 이 붙인 서명된 토큰을 검사: README 'IdP-옵셔널'
      CT_AUTH_MODE: ${CT_AUTH_MODE:-none}
      CT_OIDC_JWKS_URL: ${CT_OIDC_JWKS_URL:-}
      CT_OIDC_ISSUER: ${CT_OIDC_ISSUER:-}
      CT_OIDC_AUDIENCE: ${CT_OIDC_AUDIENCE:-}
      DATABASE_URL: postgresql+psycopg://${DB_USER:-ctower}:${DB_PASSWORD}@db:5432/${DB_NAME:-controltower}
      CT_SECRET: ${CT_SECRET:?set CT_SECRET in .env}
      CT_API_TOKEN: ${CT_API_TOKEN:?set CT_API_TOKEN in .env}
      # 지금 도는 버전 — 화면 맨 위에 보인다. 반영할 때 넣는다(예: CT_BUILD=$(git rev-parse --short HEAD)). 안 넣으면 '버전 모름(dev)'
      CT_VERSION: ${CT_VERSION:-dev}
      CT_BUILD: ${CT_BUILD:-dev}
    ports:
      # 기본 127.0.0.1(로컬 전용). 로그인 없이 VM 에 그대로 둘 때만 .env 에 BIND_ADDR=0.0.0.0 → 사내망의 러너가 접근.
      # ⚠ 로그인(IdP·리버스 프록시) 뒤에 세운 배포에서는 0.0.0.0 으로 바꾸지 말 것 — 열면 로그인을 건너뛰고 바로 닿음.
      #   프록시는 포트가 아니라 같은 docker 망으로 web 에 붙인다(서버의 docker-compose.override.yml).
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 수집기 — 화면 [다시 수집] 요청(수동)을 5초마다 확인해 처리 + 매일 CT_COLLECT_DAILY_AT(기본 09:00 서울)에 자동 한 번.
  # GitLab 만 다시 읽음(서버에 SSH 키를 두지 않음 → 서버 compose 는 지난 값).
  # .env 를 나눔: 중앙(api·db)은 .env, 수집기는 collector.env — GitLab 읽기 토큰은 수집기 컨테이너에만 들어감.
  #   cp collector.env.example collector.env → 값 채우기. 대상 파일(shape-targets.yml)은 읽기 전용으로 붙임.
  collector:
    build: ./runner
    command: ["python", "-m", "runner.cli", "agent"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${CT_COLLECTOR_ENV_FILE:-./collector.env}
    environment:
      CT_CENTRAL_URL: http://api:8000                            # 같은 compose 안의 중앙 API
      CT_API_TOKEN: ${CT_API_TOKEN:?set CT_API_TOKEN in .env}     # 중앙과 같은 러너 토큰(.env 에서)
      CT_SHAPE_TARGETS: /targets/shape-targets.yml
    volumes:
      - ${CT_SHAPE_TARGETS_FILE:-./shape-targets.yml}:/targets/shape-targets.yml:ro
    restart: unless-stopped

  web:
    build: ./central/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8090}:80"   # 기본 8090(로컬 127.0.0.1). BIND_ADDR 는 api 위 주석 참고(로그인 뒤면 0.0.0.0 금지)
    restart: unless-stopped
