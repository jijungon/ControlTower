# Control Tower — 중앙 서비스 (사내 VM에서 실행)
# 러너는 로컬 네이티브 CLI라 여기에 없음 (로컬 ~/.ssh 접근 필요). runner/ 참고.
# 실행: cp .env.example .env  →  값 채우고  →  docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-controltower}
      POSTGRES_USER: ${DB_USER:-ctower}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # 호스트 로컬 디렉토리(bind mount) — 데이터가 <repo>/data/pgdata 에 보인다. .env 로 경로 조정.
      - ${PG_DATA_DIR:-./data/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ctower} -d ${DB_NAME:-controltower}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./central/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-ctower}:${DB_PASSWORD}@db:5432/${DB_NAME:-controltower}
      CT_SECRET: ${CT_SECRET:?set CT_SECRET in .env}
      CT_API_TOKEN: ${CT_API_TOKEN:?set CT_API_TOKEN in .env}
    ports:
      # 기본 127.0.0.1(로컬 전용). VM 배포 시 .env 에 BIND_ADDR=0.0.0.0 → 사내망의 러너가 접근.
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: ./central/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8090}:80"   # 기본 8090(로컬 127.0.0.1). VM 은 BIND_ADDR=0.0.0.0
    restart: unless-stopped
